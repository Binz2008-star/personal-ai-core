[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-core"
version = "0.1.0"
description = "An AI operating layer over a replaceable local model."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Stated rather than inferred. pyright resolves this layout without it, but
# by auto-detection -- and a type gate that silently stops resolving the
# package would keep passing while checking nothing.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
