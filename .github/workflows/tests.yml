name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest

      # The whole suite first: if this fails, the named steps below only
      # narrow down where.
      - name: Full suite
        run: python -m pytest tests/ -v

      # The three layers are run separately as well, because a failure in
      # `characterization/` means something different from a failure in
      # `unit/` -- one says the Core changed, the other says our reading of
      # the legacy behaviour did.
      - name: Unit
        run: python -m pytest tests/unit -v
      - name: Characterization (legacy behaviour, and Core vs legacy)
        run: python -m pytest tests/characterization -v
      - name: Integration (composed, no infrastructure required)
        run: python -m pytest tests/integration -v

      # Named individually so a violation is legible in the checks list
      # rather than buried in a 380-line run.
      - name: Architecture -- dependency direction
        run: python -m pytest tests/unit/test_dependency_direction.py -v
      - name: Invariant -- Event != Memory
        run: python -m pytest tests/unit/test_event_not_memory.py -v

      # A skipped test must never read as a passed one. This prints every
      # skip with its reason so the log says what went unverified; it does
      # not fail on them. `tests/unit/test_expected_skips.py` is what
      # actually enforces which skips are allowed.
      - name: Report skips with reasons
        run: python -m pytest tests/ -q -rs

  # A separate job, not more steps on `suite`, for the same reason the layers
  # above are run separately: a lint failure and a test failure mean different
  # things and should not hide each other. Steps are sequential, so a red
  # suite would mean these never ran -- and the moment they stop running is
  # the moment they stop being a gate.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned deliberately. An unpinned linter turns every upstream release
      # into a possible red build on code nobody touched, and a gate that
      # fails for reasons unrelated to the change is one people learn to
      # override. Bumping these is a deliberate PR that shows what the new
      # version found.
      - run: pip install ruff==0.15.8 pyright==1.1.408

      - name: Lint
        run: ruff check .

      # Resolves `personal_ai_core` from the src/ layout via `extraPaths` in
      # pyproject.toml -- no editable install, so what CI checks is the tree
      # as committed.
      - name: Types
        run: pyright
