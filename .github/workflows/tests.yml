name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the server-gated suites (ADR-016). Until this existed the
    # 55 tests that exercise `persistence/postgres.py` -- the largest module in the
    # repository -- never ran in CI: they skipped for want of a server, and a skip
    # reads like a pass. They passed when first run against PostgreSQL 16 (2026-10-02,
    # 55 of 55), so enabling them is not a risk taken blind.
    #
    # Throwaway: a fresh container per job, gone when the job ends, with the
    # conventional example password. It is not Neon and not any database the owner
    # uses, and nothing here touches schema or data outside the container.
    #
    # Linux only. GitHub's Windows runners cannot run service containers, so
    # `suite-windows` still has no server and its gated tests still skip with the
    # accounted reason `test_expected_skips.py` allows.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pac_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Full history, not the default shallow clone.
      # `tests/unit/test_merge_ledger.py` checks PROJECT_STATE.md's merge
      # ledger against `git log --merges`. At fetch-depth 1 that log is empty
      # and the comparison has nothing to compare, so the test fails rather
      # than passing quietly -- but the right fix is to give it the history,
      # not to weaken the test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]>=3.2"
      # psycopg[binary]: the server backend's driver (ADR-016). Installed on
      # every job that imports `persistence/postgres.py` -- the conformance
      # module needs it importable so its skip is reported, not thrown, and
      # pyright needs it resolvable. On THIS job a server is advertised (the
      # service above) and the server-gated tests run; on `suite-windows` none
      # is, and they skip with an accounted reason.

      # The whole suite first: if this fails, the named steps below only
      # narrow down where.
      - name: Full suite
        env:
          # `localhost`, not 127.0.0.1: a test asserts that the same database spelled
          # with another host is refused, and it builds that spelling from this one.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/pac_test
        run: python -m pytest tests/ -v

      # The three layers are run separately as well, because a failure in
      # `characterization/` means something different from a failure in
      # `unit/` -- one says the Core changed, the other says our reading of
      # the legacy behaviour did.
      - name: Unit
        env:
          # `localhost`, not 127.0.0.1: a test asserts that the same database spelled
          # with another host is refused, and it builds that spelling from this one.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/pac_test
        run: python -m pytest tests/unit -v
      - name: Characterization (legacy behaviour, and Core vs legacy)
        run: python -m pytest tests/characterization -v
      - name: Integration (composed; the server-gated suites run against the service)
        env:
          # `localhost`, not 127.0.0.1: a test asserts that the same database spelled
          # with another host is refused, and it builds that spelling from this one.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/pac_test
        run: python -m pytest tests/integration -v

      # `tests/support` holds no tests. It is the shared PostgreSQL URL
      # resolver, imported by the two server-gated modules, and it is named
      # here because `test_ci_workflow.py` requires every directory under
      # `tests/` to appear in this workflow -- which is the right requirement,
      # since a support package nothing imports is precisely the silently-dead
      # directory that gate exists to prevent.
      #
      # It is checked by importing it rather than by running pytest against
      # it, because `pytest tests/support` exits 5 on a directory with no
      # tests in it, and a step that always fails is a step nobody reads. The
      # import is the real check: it proves the module resolves on the CI path
      # layout, and that with no POSTGRES_TEST_URL advertised -- which is the
      # situation in CI -- the resolver returns empty and the server-gated
      # suites skip with an accounted reason rather than raising.
      #
      # PYTHONPATH=src because `postgres_target` imports `personal_ai_core`,
      # and nothing installs the package: pytest finds src/ through
      # `pythonpath` in pyproject.toml, a bare `python -c` does not. Same
      # src-layout resolution, stated explicitly -- no editable install, so
      # what this checks is the tree as committed.
      - name: Test support package resolves
        env:
          PYTHONPATH: src
        run: >-
          python -c "import sys; sys.path.insert(0, 'tests');
          from support.postgres_target import server_url, server_identity;
          assert server_url() == '', server_url();
          print('tests/support resolved; no POSTGRES_TEST_URL advertised')"

      # Named individually so a violation is legible in the checks list
      # rather than buried in a 380-line run.
      - name: Architecture -- dependency direction
        run: python -m pytest tests/unit/test_dependency_direction.py -v
      - name: Invariant -- Event != Memory
        run: python -m pytest tests/unit/test_event_not_memory.py -v

      # A skipped test must never read as a passed one. This prints every
      # skip with its reason so the log says what went unverified; it does
      # not fail on them. `tests/unit/test_expected_skips.py` is what
      # actually enforces which skips are allowed.
      - name: Report skips with reasons
        env:
          # `localhost`, not 127.0.0.1: a test asserts that the same database spelled
          # with another host is refused, and it builds that spelling from this one.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/pac_test
        run: python -m pytest tests/ -q -rs

  # A separate job, not more steps on `suite`, for the same reason the layers
  # above are run separately: a lint failure and a test failure mean different
  # things and should not hide each other. Steps are sequential, so a red
  # suite would mean these never ran -- and the moment they stop running is
  # the moment they stop being a gate.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned deliberately. An unpinned linter turns every upstream release
      # into a possible red build on code nobody touched, and a gate that
      # fails for reasons unrelated to the change is one people learn to
      # override. Bumping these is a deliberate PR that shows what the new
      # version found.
      #
      # pytest is here for pyright, not to run anything. Type-checking
      # `tests/` means resolving what `tests/` imports, and without it every
      # test file reported `Import "pytest" could not be resolved` -- 33
      # errors that said nothing about the code. A type gate drowning in
      # unresolved-import noise is one whose real findings get skimmed past.
      - run: pip install ruff==0.15.8 pyright==1.1.408 pytest==9.1.1 "psycopg[binary]>=3.2"
      # psycopg[binary] is here so pyright can resolve the server backend's
      # imports (`persistence/postgres.py`); without it every `import psycopg`
      # in that module reports an unresolved-import error that says nothing
      # about the code. Same reasoning as pytest's presence in this line.

      - name: Lint
        run: ruff check .

      # Resolves `personal_ai_core` from the src/ layout via `extraPaths` in
      # pyproject.toml -- no editable install, so what CI checks is the tree
      # as committed.
      - name: Types
        run: pyright

      # The same tree, typed against the oldest Python pyproject.toml admits
      # and the one the owner's machine runs. The stubs differ by version:
      # shlex.split took None until 3.12, and a test that passed against 3.11
      # failed here (#222). Each is a few seconds; a version nobody types
      # against is one whose breakage arrives on the owner's machine first.
      - name: Types (Python 3.11, the declared minimum)
        run: pyright --pythonversion 3.11
      - name: Types (Python 3.14, the owner's machine)
        run: pyright --pythonversion 3.14

  # Windows exists as its own job, NOT as a matrix leg on `suite`, and the
  # reason is worth stating so nobody "simplifies" it back.
  #
  # A matrix renames the check: `suite` becomes `suite (ubuntu-latest)` and
  # `suite (windows-latest)`. Branch protection on main requires a check named
  # `suite`. A matrix therefore means that check is never reported again --
  # the first attempt at this change sat at mergeable_state `blocked` with
  # every leg green, and merging it would have left main requiring a check
  # that no run can produce, blocking every later PR.
  #
  # So the name stays put and Windows arrives beside it. Adding this job to
  # the required checks is a protection change, and a separate decision.
  #
  # It runs the full suite and nothing else. The named steps on `suite` exist
  # to make a Linux failure legible; on Windows the question is narrower --
  # does the suite pass on a platform whose path separator differs -- and two
  # defects reached main because nothing asked it.
  suite-windows:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 for the same reason as `suite`: the merge-ledger test
      # compares PROJECT_STATE.md against `git log --merges`, and a shallow
      # clone gives it nothing to compare.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]>=3.2"
      # psycopg[binary]: the server backend's driver (ADR-016). Installed on
      # every job that imports `persistence/postgres.py` -- the conformance
      # module needs it importable so its skip is reported, not thrown, and
      # pyright needs it resolvable. No server is advertised in CI, so the
      # server-gated tests skip with an accounted reason there.

      - name: Full suite
        run: python -m pytest tests/ -v

      # Same reason as on `suite`: a skipped test must never read as a passed
      # one, and a skip that only happens on Windows is exactly the kind this
      # job exists to surface.
      - name: Report skips with reasons
        run: python -m pytest tests/ -q -rs
